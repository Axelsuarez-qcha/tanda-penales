<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tanda de Penales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Noche de Bombonera: azul profundo, oro como único acento, tablero de estadio en tipografía condensada.
   Layout: una columna central; el arco es el protagonista de la pantalla de juego. */
:root{
  --bg:#06143a; --panel:#0c2155; --panel2:#112b69; --line:#27428f;
  --gold:#f4c20d; --azul:#5aaeff; --ink:#eef2ff; --muted:#9db0e0; --good:#3ddc97; --bad:#ff6b6b;
  --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif; --body:'Public Sans',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
body{min-height:100%;background:radial-gradient(1200px 500px at 50% -10%,#123a8f55,transparent),var(--bg)}
#app{max-width:980px;margin:0 auto;padding:16px 16px 56px}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0;line-height:1;text-wrap:balance}
h1{font-size:clamp(52px,12vw,104px);font-weight:900}
h2{font-size:32px;font-weight:800}
h3{font-size:20px;font-weight:800;color:var(--gold)}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:13px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--gold);color:#1a1400;border:0;border-radius:10px;padding:12px 18px;font-weight:700;font-size:16px}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--gold)}
.btn[disabled]{opacity:.4;cursor:not-allowed;filter:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:700px){.grid3{grid-template-columns:1fr}}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.brand{font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:.05em;text-transform:uppercase}
.brand b{color:var(--gold)}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.tag.live{background:#d92d2d;border-color:#d92d2d;color:#fff}
/* home */
.hero{padding:28px 0 8px}
.hero h1 span{color:var(--gold)}
.hero p{max-width:56ch;color:var(--muted);font-size:18px;margin-top:14px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:24px 0}
@media(max-width:700px){.modes{grid-template-columns:1fr}}
.mode{display:flex;flex-direction:column;gap:10px}
.mode.off{opacity:.65}
.seg{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;background:transparent;border:0;padding:9px 6px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--gold);color:#1a1400}
.switch{display:flex;gap:10px;align-items:center;cursor:pointer;user-select:none}
.switch input{width:20px;height:20px;accent-color:var(--gold)}
ol.rules{padding-left:20px;margin:0;color:var(--muted)}
ol.rules li{margin-bottom:6px}
/* player cards */
.pc{background:var(--panel2);border:1.5px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;text-align:left;position:relative;min-height:150px}
button.pc:hover:not([disabled]){border-color:var(--gold);transform:translateY(-2px)}
button.pc{transition:transform .12s,border-color .12s}
button.pc[disabled]{opacity:.45;cursor:not-allowed}
.pc .nm{font-weight:700;font-size:17px;line-height:1.15;padding-right:58px}
.pc .ps{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.pc .ov{position:absolute;right:12px;top:8px;font-family:var(--display);font-weight:900;font-size:44px;color:var(--gold);line-height:1}
.pc .ov small{display:block;font-size:10px;letter-spacing:.1em;color:var(--muted);font-family:var(--body);font-weight:600;text-align:right}
.pc.gk{border-color:#3b66d9}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;border:1px solid}
.chip.pos{color:var(--good);border-color:#2a8f66}
.chip.neg{color:var(--bad);border-color:#a84747}
.chip.gk{color:#9bb6ff;border-color:#3b66d9}
.bars{display:flex;gap:4px;align-items:flex-end;height:28px}
.bars i{flex:1;background:var(--gold);opacity:.8;border-radius:2px 2px 0 0;min-height:2px;position:relative}
.bars.l{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;height:auto;font-size:11px;color:var(--muted)}
.bars.l span{white-space:nowrap}
.side h3{margin-bottom:6px}
.stat{font-size:13px;color:var(--muted)}
.blind{font-size:13px;color:var(--muted);font-style:italic}
/* draft */
.draft{display:grid;grid-template-columns:2fr 1fr;gap:14px}
@media(max-width:820px){.draft{grid-template-columns:1fr}}
.ros{display:flex;flex-direction:column;gap:6px}
.ros .it{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:6px 10px;border-radius:8px;background:var(--panel2)}
.ros .it.gk{border-left:3px solid #6f93ff}
.ros .it.empty{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.feed{max-height:140px;overflow:auto;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.feed b{color:var(--ink)}
.rolebox{border-left:4px solid var(--gold);padding:8px 12px;background:#ffffff0d;border-radius:0 10px 10px 0;margin-bottom:12px}
/* order */
.ord{display:flex;flex-direction:column;gap:8px}
.ord .it{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.ord .n{font-family:var(--display);font-size:32px;font-weight:900;color:var(--gold);text-align:center}
.ord .mv{display:flex;flex-direction:column;gap:4px}
.ord .mv button{background:var(--panel);border:1px solid var(--line);border-radius:6px;width:34px;height:24px;line-height:1;padding:0}
.ord .mv button:hover:not([disabled]){border-color:var(--gold)}
.ord .mv button[disabled]{opacity:.3}
.timer{height:8px;background:#ffffff18;border-radius:6px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--gold);transition:width 1s linear}
/* match */
.board{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.board .tm{display:flex;flex-direction:column;gap:6px}
.board .tm.r{align-items:flex-end}
.board .tn{font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.04em}
.board .tn.me{color:var(--azul)}
.dots{display:flex;gap:6px}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:900}
.dot.g{background:var(--good);border-color:var(--good);color:#04281a}
.dot.m{background:transparent;border-color:var(--bad);color:var(--bad)}
.dot.cur{border-color:var(--gold);box-shadow:0 0 0 3px #f4c20d44}
.score{font-family:var(--display);font-weight:900;font-size:64px;line-height:1;letter-spacing:.02em;text-align:center}
.score small{display:block;font-size:12px;letter-spacing:.14em;color:var(--muted);font-family:var(--body);font-weight:700;margin-top:4px}
.stage{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;margin-top:14px}
@media(max-width:860px){.stage{grid-template-columns:1fr}}
.goalwrap{background:linear-gradient(#0a3a1a,#0e4d24);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative}
.goalwrap svg{position:absolute;left:0;top:0;width:100%;height:100%}
.pxc{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;background:#0b4420}
.face{margin-top:12px;background:#060d26;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.dlgs{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}
@media(max-width:560px){.dlgs{grid-template-columns:1fr}}
.dlg{border:3px solid;border-radius:6px;padding:6px 9px;background:#04102e;min-height:64px;font-family:ui-monospace,Menlo,Consolas,monospace}
.dlg.tb{border-color:#2f6bff}.dlg.to{border-color:#f4c20d}
.dn{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dlg.tb .dn{color:#7fa8ff}.dlg.to .dn{color:#f4c20d}
.dt{font-size:14px;min-height:20px;margin:2px 0 4px;word-break:break-word}
.chrow{display:flex;gap:6px}
.chin{flex:1;min-width:0;background:#0a1a4a;border:2px solid var(--line);border-radius:4px;color:var(--ink);padding:6px 8px;font:inherit;font-size:14px}
.chgo{background:var(--gold);color:#111;border:0;border-radius:4px;padding:0 12px;font-weight:800;cursor:pointer}
.zone{fill:#ffffff00;stroke:#ffffff22;cursor:pointer;transition:fill .12s}
.zone:hover{fill:#f4c20d33}
.zone.sel{fill:#f4c20d55}
.zone.off{cursor:default}
.zone.off:hover{fill:#ffffff00}
.zl{font-family:var(--display);font-weight:800;font-size:26px;fill:#ffffffaa;pointer-events:none;letter-spacing:.06em}
#ball{transition:transform .7s cubic-bezier(.2,.8,.3,1)}
#keeper{transition:transform .5s cubic-bezier(.3,.9,.3,1)}
.prompt{position:absolute;left:0;right:0;top:8px;text-align:center;pointer-events:none}
.prompt span{display:inline-block;background:#06143acc;border:1px solid var(--line);border-radius:99px;padding:4px 14px;font-weight:700;font-size:14px}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.type{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:10px;text-align:left}
.type[aria-pressed=true]{border-color:var(--gold);background:#f4c20d1c}
.type b{display:block;font-family:var(--display);font-size:22px;text-transform:uppercase;letter-spacing:.03em}
.type span{font-size:12px;color:var(--muted);line-height:1.25;display:block}
.type .risk{display:flex;gap:3px;margin-top:6px}
.type .risk i{width:16px;height:5px;border-radius:3px;background:#ffffff22}
.type .risk i.on{background:var(--gold)}
.side{display:flex;flex-direction:column;gap:12px}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vs .pc{min-height:0;padding:10px}
.vs .pc .nm{font-size:15px;padding-right:44px}
.vs .pc .ov{font-size:32px;top:6px}
.vs .role{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.relato{background:#04102e;border:1px solid var(--line);border-radius:14px;padding:12px 14px;max-height:300px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.relato p{margin:0;font-size:15px}
.relato p.pre{color:var(--muted)}
.relato p.go{color:var(--ink);font-weight:600}
.relato p.good{color:var(--good);font-weight:700}
.relato p.bad{color:var(--bad);font-weight:700}
.relato p.sys{color:var(--gold);font-family:var(--display);font-size:20px;text-transform:uppercase;font-weight:800;letter-spacing:.03em}
details.dbg{margin-top:10px;font-size:13px;color:var(--muted)}
details.dbg summary{cursor:pointer;color:var(--ink)}
details.dbg table{border-collapse:collapse;margin-top:6px;width:100%}
details.dbg td{padding:3px 6px;border-bottom:1px solid #ffffff14}
.final{text-align:center;padding:24px}
.verdict{border-radius:22px;padding:28px 16px 22px;margin:6px 0 18px;text-align:center;animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
.verdict.win{background:linear-gradient(135deg,#f5c400,#ffe27a 55%,#f5c400);color:#0a1a44;box-shadow:0 0 0 3px #fff3 inset,0 10px 40px #f5c40055}
.verdict.lose{background:linear-gradient(135deg,#1b2447,#2a1f3d);color:#e9ecf8;border:2px solid #5a4a7a}
.verdict .vt{font-family:var(--disp,inherit);font-weight:900;font-size:clamp(44px,12vw,110px);line-height:1;letter-spacing:.02em;text-transform:uppercase}
.verdict .vscore{display:inline-block;margin-top:12px;background:#0a1a44ee;border-radius:99px;padding:6px 20px;font-size:clamp(20px,5vw,34px);font-weight:800;color:#fff;text-align:center}
.verdict .vscore b{font-size:1.25em;padding:0 4px}
.tb{color:var(--azul)}.to{color:var(--gold)}
.tl{display:flex;margin:8px 0}.tl.t1{justify-content:flex-end}
.tl .tlc{display:flex;align-items:center;gap:10px;max-width:90%;min-width:62%;background:var(--panel2);border-radius:12px;padding:8px 12px;border-left:5px solid var(--azul)}
.tl.t1 .tlc{flex-direction:row-reverse;text-align:right;border-left:0;border-right:5px solid var(--gold)}
.tl .ic{flex:0 0 auto;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:18px}
.tl .ic.g{background:var(--good);color:#04281a}.tl .ic.m{background:transparent;border:2.5px solid var(--bad);color:var(--bad)}
.tl .who{font-weight:800;font-size:16px}.tl .sub{font-size:12px;color:var(--muted)}
.tl .res.g{color:var(--good);font-weight:800}.tl .res.m{color:var(--bad);font-weight:800}
.tdots{display:flex;align-items:center;gap:10px;margin:6px 0;flex-wrap:wrap}.tdots .dots{flex-wrap:wrap}
.tdots.r{justify-content:flex-end}
.verdict .vn{margin-top:8px;font-size:15px;opacity:.85}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.awards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:12px 0;text-align:left}
.awards .aw{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--panel)}
.awards .aw small{display:block;font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.awards .aw b{display:block;font-size:20px;margin:4px 0 2px}
.awards .aw.fig{border-color:var(--gold)}.awards .aw.bur{border-color:#c0504d}
table.tanda{width:100%;border-collapse:collapse;font-size:14px;text-align:left}
table.tanda td{padding:6px 6px;border-top:1px solid var(--line);vertical-align:top}
table.tanda .g{color:var(--good);font-weight:800}table.tanda .m{color:var(--bad);font-weight:800}
.tg{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:99px;margin-left:4px;background:var(--gold);color:#0a1a44}
.tg.b{background:#c0504d;color:#fff}.tg.p{background:#3b82f6;color:#fff}
.leave{font:inherit;font-size:12px;font-weight:700;background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:3px 10px;cursor:pointer;margin-left:8px}
.leave.arm{background:#d92d2d;border-color:#d92d2d;color:#fff}
.final h1{font-size:clamp(44px,10vw,88px)}
.coin{width:120px;height:120px;border-radius:50%;margin:20px auto;background:radial-gradient(circle at 35% 30%,#ffe27a,#c79500 70%);color:#3a2a00;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:44px;box-shadow:inset 0 0 0 6px #ffffff40,0 10px 30px #0008;animation:flip 1.2s ease-out}
@keyframes flip{0%{transform:rotateY(0) translateY(0)}50%{transform:rotateY(900deg) translateY(-40px)}100%{transform:rotateY(1800deg) translateY(0)}}
@media(max-width:560px){.score{font-size:42px;white-space:nowrap}.board{padding:10px;gap:8px}.board .tn{font-size:16px}.dot{width:16px;height:16px;font-size:9px}.dots{gap:4px}}

/* veto + presupuesto / subasta */
.draft>*,.grid3>*{min-width:0}
.grid2c{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(max-width:480px){.grid2c{grid-template-columns:1fr}}
.pc .pr{position:absolute;right:12px;bottom:10px;text-align:right;font-family:var(--display);font-weight:900;font-size:28px;line-height:1;color:var(--ink);background:#f4c20d22;border:1px solid #f4c20d77;border-radius:10px;padding:4px 10px}
.pc .pr small{display:block;font-size:10px;letter-spacing:.1em;color:var(--muted);font-family:var(--body);font-weight:700;text-transform:uppercase}
.pc.veto{border-color:#a84747}
button.pc.veto:hover:not([disabled]){border-color:var(--bad);background:#ff6b6b18}
.vetotag{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--bad)}
.bud{margin-bottom:8px}
.bud .t{display:flex;justify-content:space-between;font-size:14px}
.bud .t b{font-family:var(--display);font-size:22px;letter-spacing:.03em;text-transform:uppercase}
.bud .timer i{transition:width .3s}
.clue{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:7px 10px;border-radius:8px;background:var(--panel2);margin-bottom:6px;font-size:15px;min-height:36px;align-items:center}
.clue .cl{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.clue:not(.on){opacity:.45}
.clue.on{animation:clueIn .5s ease-out}
.clue.k-nivel.on .cv,.clue.k-nombre.on .cv{font-family:var(--display);font-size:26px;font-weight:900;color:var(--gold);line-height:1}
@keyframes clueIn{from{background:#f4c20d55;transform:translateX(-6px)}to{background:var(--panel2);transform:none}}
.bidrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 8px}
.bidrow div{background:var(--panel2);border-radius:10px;padding:8px 10px}
.bidrow small{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.bidrow b{font-family:var(--display);font-size:26px;letter-spacing:.02em}
.bidrow b.me{color:var(--gold)}
.bigt{font-family:var(--display);font-weight:900;font-size:40px;line-height:1}
.ext{color:var(--good);font-weight:800;margin-left:8px}
.sold{width:100%;border-collapse:collapse;font-size:12px}
.sold th{text-align:left;color:var(--muted);font-weight:700;padding:3px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.sold td{padding:4px 6px;border-bottom:1px solid #ffffff12;white-space:nowrap}
.sold .own0{border-left:3px solid var(--gold)}
.sold .own1{border-left:3px solid #6f93ff}
.scroll{overflow-x:auto}
select{font:inherit;background:var(--panel2);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:8px;width:100%}
.bigfi{font-family:var(--display);font-weight:900;font-size:40px;color:var(--gold);line-height:1}
.notice{background:#3a2a00;border:1px solid var(--gold);color:var(--ink);padding:8px 12px;border-radius:10px;margin-bottom:10px;font-size:14px}
.notice:empty{display:none}
input.txt{font:inherit;background:var(--panel2);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
@media(prefers-reduced-motion:reduce){.coin{animation:none}#ball,#keeper{transition:none}}
</style>
</head>

<div id="app"></div>
<script>window.ONLINE_ENABLED=true;</script>
<script>/* Tanda de penales — motor del juego (puro, sin DOM, determinista con semilla). */
(function (root) {
'use strict';
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const logit = p => Math.log(p / (1 - p));
const sig = x => 1 / (1 + Math.exp(-x));
const shrink = (g, n, prior, k) => (g + prior * k) / (n + k);
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const pick = (rng, arr) => arr[Math.floor(rng() * arr.length)];
function shuffle(rng, arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

const SIDES = ['L', 'C', 'R'];
const TYPES = ['normal', 'fuerte', 'picada'];

/* ---------- 1) FÍSICA DEL PENAL (coordenadas en metros) ----------

<script>
(function(){
'use strict';
const E = window.Engine;
E.calibrate(PLAYERS);
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const NAMES = ['Azul', 'Oro'];
const DRAFT_SEC = 12, SHOT_SEC = 15, ORDER_SEC = 15;
const ONLINE = !!window.ONLINE_ENABLED;
const SALA = (new URLSearchParams(location.search).get('sala')||'').toUpperCase().replace(/[^A-Z]/g,'').slice(0,5);
const POS = {ARQ:'Arquero',DFC:'Central',DFI:'Lateral izq.',DFD:'Lateral der.',LI:'Lateral izq.',LD:'Lateral der.',MC:'Volante',MCD:'Volante def.',MCO:'Volante of.',MI:'Volante izq.',MD:'Volante der.',ENG:'Enganche',ED:'Extremo der.',EI:'Extremo izq.',EXT:'Extremo',DC:'Delantero',SD:'Segundo delantero'};
const TYPE_INFO = {
  normal:{n:'Normal',d:'Colocada. Pocas chances de errar.',r:1},
  fuerte:{n:'Fuerte',d:'Arriesga más, pero si el arquero adivina el lado igual lo desborda.',r:2},
  picada:{n:'Picada',d:'Muy arriesgada. Si entra sube la moral del próximo pateador. Si falla, la baja un poco.',r:3}
};
const SIDE_N = {L:'Izquierda',C:'Medio',R:'Derecha'};

let S = null;
const load = () => { try { return JSON.parse(localStorage.getItem('tp_prefs')||'{}'); } catch(e){ return {}; } };
const save = p => { try { localStorage.setItem('tp_prefs', JSON.stringify(p)); } catch(e){} };
const prefs = Object.assign({diff:'normal', informed:true, mode:'libre', draft:'veto', lot:30, name:''}, load());

function newGame(){
  const seed = (Date.now() ^ (Math.random()*1e9)) >>> 0;
  S = { screen:'toss', seed, rng:E.mulberry32(seed), diff:prefs.diff, informed:prefs.informed, draft:null, dmode:prefs.draft, au:null, mode:prefs.mode, online:false, order:[], sh:null, feed:[], sel:{type:'normal'}, pk:null, busy:false, rec:null, tick:null, timeLeft:60 };
  S.tossWinner = S.rng() < .5 ? 0 : 1;
  S.coinFace = S.rng() < .5 ? 'CARA' : 'CRUZ';
  render();
}

/* ---------- Utilidades de vista ---------- */
function sideBars(p, gk){
  let v;
  if (gk){ if(!p.a) return ''; v = p.a.dive; } else { if(!p.k) return ''; v = p.k.s; var raw = v; v = {P1:raw.P1[0],P2:raw.P2[0],M:raw.M[0]}; }
  const tot = v.P1+v.P2+v.M; if(!tot) return '';
  // Se traduce a lados físicos según la pierna
  const out = {L:0,C:0,R:0};
  for (const d of ['P1','P2','M']) out[E.physSide(p,d)] += v[d];
  const pc = x => Math.round(100*x/tot);
  return `<div class="bars l" title="${gk?'Hacia dónde se tira':'Hacia dónde patea'} (n=${tot})"><span>Izq ${pc(out.L)}%</span><span>Med ${pc(out.C)}%</span><span>Der ${pc(out.R)}%</span></div>`;
}
function cardInner(p, informed){
  const perks = E.perksOf(p);
  const chips = (p.gk?'<span class="chip gk">Arquero</span>':'') + perks.map(k=>`<span class="chip ${k.tone}" title="${esc(k.desc)}">${esc(k.label)}</span>`).join('');
  let st = '';
  if (informed){
    if (p.gk && p.a) st = `<div class="stat">Enfrentó ${p.a.n} penales, atajó ${p.a.sv}</div>`+sideBars(p,true);
    else if (p.k) st = `<div class="stat">Tandas: pateó ${p.k.n}, convirtió ${p.k.g} (${Math.round(100*p.k.g/p.k.n)}%)</div>`+sideBars(p,false);
    if (!p.gk && p.pen) st += `<div class="stat">Penales en partidos: ${p.pen} convertidos</div>`;
    if (p.h!=null) st += `<div class="stat">Jerarquía histórica: ${Math.round(p.h*99)}</div>`;
  } else st = '<div class="blind">A ciegas: sin estadísticas</div>';
  return `<div class="ov">${informed?E.ovr(p):'?'}<small>NIVEL</small></div><div class="nm">${esc(p.nombre)}</div><div class="ps">${esc(POS[p.pos]||p.pos)}${p.pierna==='I'?' · zurdo':''}</div>${chips?`<div class="chips">${chips}</div>`:''}${st}`;
}

/* ---------- Pantallas ---------- */
function render(){
  clearInterval(S && S.tick); clearInterval(S && S.atick);
  const top = `<div class="topbar"><div class="brand">Tanda de <b>Penales</b></div><span>${musBtn()}<span class="tag">${S&&S.online?'Online':'Prototipo'}</span>${S?'<button class="leave" id="leave">Salir de la partida</button>':''}</span></div><div id="notice" class="notice">${S&&S.online?(S.notice||olOffText()):(HOMEMSG||'')}</div>`;
  if (!S) { app.innerHTML = top + home(); bindHome(); return; }
  const f = {toss:toss, draft:draft, order:orderScr, match:match, end:endScr, ollobby:olLobby, oltoss:olToss}[S.screen];
  app.innerHTML = top + f();
  bindLeave(); bindMus(); audSync();
  ({toss:bindToss, draft:bindDraft, order:bindOrder, match:bindMatch, end:bindEnd, ollobby:bindOlLobby, oltoss:bindOlToss}[S.screen])();
  if (S.screen==='match' && S.pk){ bindChat(); pxStart(); } else pxStop();
  if (S.screen==='match' && !S.rec && !S.busy){ if (S.online){ if(S.ol.deadline) startTimerUntil(S.ol.deadline); } else startTimer(SHOT_SEC, autoShot); }
}

/* HOME */
const DR_INFO = {
  clasico:'Salen 3 jugadores por vez: uno elige 1 y el otro se lleva 2.',
  veto:'Salen 4 cartas por ronda. El rival veta 1, elegís entre las que quedan y cada jugador tiene un precio: 32 fichas para todo el equipo.',
  subasta:'Un jugador por vez, con pistas que se van revelando. Todos los de campo comparten un rasgo oculto: descubrilo. 100 fichas para todo el equipo.'
};

/* SORTEO */
function toss(){
  const w = S.tossWinner, coin=`<div class="coin">${S.coinFace==='CARA'?'C':'X'}</div>`;
  if (w===0){
    if (S.dmode==='subasta') return `<div class="final">${coin}<h2>Ganaste el sorteo</h2>
    <p class="muted">Salió ${S.coinFace.toLowerCase()}. Elegí si querés patear primero o segundo en la tanda. Patear primero es una ventaja, pero arrancás la subasta con 5 fichas menos: 95 contra 100.</p>
    <div class="row" style="justify-content:center"><button class="btn" data-f="0">Patear primero (95 fichas)</button><button class="btn ghost" data-f="1">Patear segundo (100 fichas)</button></div></div>`;
    const extra = S.dmode==='veto' ? 'Quien elige primero en la ronda 1 (y en las impares) tiene ventaja en el draft, pero patea segundo en la tanda.' : 'Hay una compensación: quien elige segundo patea primero en la tanda.';
    return `<div class="final">${coin}<h2>Ganaste el sorteo</h2>
    <p class="muted">Salió ${S.coinFace.toLowerCase()}. Elegí cómo arrancar el draft. ${extra}</p>
    <div class="row" style="justify-content:center"><button class="btn" data-f="0">${S.dmode==='veto'?'Elegir primero':'Elegir primero (1 jugador)'}</button><button class="btn ghost" data-f="1">${S.dmode==='veto'?'Elegir segundo':'Elegir segundo (2 jugadores)'}</button></div></div>`;
  }
  return `<div class="final">${coin}<h2>Ganó el sorteo la IA</h2><p class="muted" id="aiTxt">Está decidiendo...</p></div>`;
}
function bindToss(){
  const go = F => {
    if (S.dmode==='subasta'){ auBegin(F===0?0:1); return; }
    S.draft = S.dmode==='veto' ? E.vtStart(E.vtNew(PLAYERS,S.rng),F) : E.startDraft(E.newDraft(PLAYERS,S.rng), F);
    S.F=F; S.screen='draft'; render(); draftTick();
  };
  if (S.tossWinner===0) document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{
    // en subasta, data-f=0 significa "yo pateo primero"; el motor usa S = el que patea primero
    if (S.dmode==='subasta') auBegin(+b.dataset.f===0?0:1); else go(+b.dataset.f);
  });
  else { const aiFirst = S.rng()<.5; setTimeout(()=>{
      const msg = S.dmode==='subasta' ? (aiFirst?'La IA elige patear primero (arranca con 95 fichas).':'La IA elige patear segundo (arranca con 100 fichas).') : (aiFirst ? 'La IA elige empezar eligiendo primero.' : 'La IA elige elegir segundo.');
      $('#aiTxt').textContent = msg;
      setTimeout(()=>{ if (S.dmode==='subasta') auBegin(aiFirst?1:0); else go(aiFirst?1:0); },1400); },900); }
}

/* DRAFT */
function dText(e){
  const by = S.draft.byId, nm = id=>`<b>${esc(by[id].ap)}</b>`, tn = t=>t===0?'Vos':'La IA';
  if (e.type==='pick') return `${tn(e.team)} elige a ${nm(e.id)}.`;
  if (e.type==='rest') return `${tn(e.team)} se queda con ${e.ids.map(nm).join(' y ')}.`;
  if (e.type==='auto') return `El último, ${e.ids.map(nm).join(', ')}, va para ${tn(e.team).toLowerCase()}.`;
  return null;
}
function roleText(t){
  const d = S.draft, me = t.team===0, rival = me?'tu rival':'la IA';
  const st = t.step, F = d.F;
  if (st===0) return me ? `Ronda 1: elegís 1 jugador. ${cap(rival)} se lleva los otros 2.` : `Ronda 1: elige la IA. Vos te llevás los 2 que queden.`;
  if (st===1) return t.sub===0 ? (me?'Ronda 2: elegís 1. Después elige el rival y el que sobra queda para la próxima ronda.':'Ronda 2: elige la IA primero.') : (me?'Ronda 2: elegís 1 de los 2 que quedan.':'Ronda 2: elige la IA el segundo.');
  if (st===2) return me ? 'Ronda 3: elegís 1 y tu rival se lleva los otros 2.' : 'Ronda 3: elige la IA. Vos te llevás los 2 que queden.';
  return me ? 'Ronda 4: elegís 1 y tu rival se lleva los otros 2. El último jugador del mazo va para vos o para él según el reparto.' : 'Ronda 4: elige la IA. Vos te llevás los 2 que queden.';
}
const cap = s => s[0].toUpperCase()+s.slice(1);
function timerRow(){ return `<div class="row" style="margin:10px 0"><div class="timer" style="flex:1"><i id="tbar2" style="width:100%"></i></div><b id="ttxt2"></b></div>`; }
function startTimer(sec,onExpire){
  clearInterval(S.tick); let left=sec;
  const upd=()=>{ const b=$('#tbar2'),x=$('#ttxt2'); if(b){b.style.width=(left/sec*100)+'%'; b.style.background=left<=3?'var(--bad)':'var(--gold)';} if(x) x.textContent=left+' s'; };
  upd(); S.tick=setInterval(()=>{ left--; upd(); if(left<=0){ clearInterval(S.tick); onExpire(); } },1000);
}
function roster(t){
  const d = S.draft, ids = d.teams[t]; const rows = ids.map(id=>{const p=d.byId[id];return `<div class="it ${p.gk?'gk':''}"><span>${esc(p.ap)}</span><span class="muted">${p.gk?'ARQ':esc(p.pos)}</span></div>`;});
  while(rows.length<6) rows.push('<div class="it empty">...</div>');
  return `<div><h3>${t===0?'Tu equipo (Azul)':'IA (Oro)'}</h3><div class="ros">${rows.join('')}</div></div>`;
}
function draft(){
  if (S.dmode==='veto') return vetoScr();
  if (S.dmode==='subasta') return auScr();
  const d = S.draft, t = E.turn(d); if(!t) return `<h2>Equipos listos</h2><p class="muted">Pasamos al orden de pateadores.</p><div class="grid3"><div>${roster(0)}</div><div>${roster(1)}</div></div>`;
  const legal = new Set(E.legalPicks(d));
  const mine = t.team===0;
  const feed = d.log.map(dText).filter(Boolean).slice(-8).reverse().map(x=>`<div>${x}</div>`).join('') || '<div>Todavía no se eligió a nadie.</div>';
  const cards = t.options.map(id=>{const p=d.byId[id],ok=legal.has(id);
    return `<button class="pc ${p.gk?'gk':''}" data-id="${id}" ${(!mine||!ok)?'disabled':''} ${mine&&!ok?'title="No disponible: dejaría a un equipo con los 2 arqueros."':''}>${cardInner(p,S.informed)}${mine&&!ok?'<div class="small" style="color:var(--bad)">No disponible: dejaría a un equipo con los 2 arqueros.</div>':''}</button>`;}).join('');
  return `<h2>Draft</h2><div class="rolebox"><b>${mine?'Te toca':'Elige la IA'}.</b> ${roleText(t)}</div>
  ${mine?timerRow():''}<div class="draft"><div><div class="grid3" id="cards">${cards}</div><div class="card" style="margin-top:12px"><h3>Mesa</h3><div class="feed">${feed}</div></div></div>
  <div class="side">${roster(0)}${roster(1)}</div></div>`;
}
function bindDraft(){
  if (S.dmode==='veto') return bindVeto();
  if (S.dmode==='subasta') return bindAu();
  document.querySelectorAll('#cards .pc').forEach(b=>b.onclick=()=>{ if(b.disabled) return; S.draft = E.applyPick(S.draft,+b.dataset.id); render(); draftTick(); });
}
function draftTick(){
  if (S.screen!=='draft') return;
  if (S.dmode==='veto') return vetoTick();
  if (S.dmode==='subasta') return;
  const t = E.turn(S.draft);
  if (!t){ // draft terminado
    setTimeout(()=>{ startOrder(); },900); render(); return;
  }
  if (t.team===0){
    startTimer(DRAFT_SEC,()=>{ const lp=E.legalPicks(S.draft); S.draft=E.applyPick(S.draft,E.pick(S.rng,lp)); render(); draftTick(); });
  }
  if (t.team===1){
    setTimeout(()=>{
      const lp = E.legalPicks(S.draft); const rng=S.rng;
      let id;
      if (S.diff==='facil' && rng()<.5) id = E.pick(rng, lp);
      else id = lp.slice().sort((a,b)=>E.ovr(S.draft.byId[b])-E.ovr(S.draft.byId[a]))[0];
      S.draft = E.applyPick(S.draft,id); render(); draftTick();
    }, 1100);
  }
}


/* ---------- DRAFT: VETO + FICHAS ---------- */
function vtDText(e){
  const d=S.draft, by=d.byId, nm=id=>`<b>${esc(by[id].ap)}</b>`, tn=t=>t===0?'Vos':'La IA';
  if (e.type==='veto') return `${tn(e.team)} vetó a ${nm(e.id)}. Sale del juego.`;
  if (e.type==='pick') return `${tn(e.team)} elige a ${nm(e.id)} por ${e.cost} fichas.`;
  return null;
}
function vtRole(t){
  const me=t.team===0, first=t.first===0?'Vos':'La IA', head=`Ronda ${t.round+1} de 6. Elige primero: <b>${first}</b>. `;
  if (t.sub==='veto') return head+(me?'Vetá 1 carta: sale del juego. Los arqueros no se pueden vetar. Después elige 1 el primero de la ronda de las 3 que queden y vos 1 de las 2 restantes.':'La IA está por vetar una carta.');
  if (t.sub==='p1') return head+(me?'Elegí 1 de las 3 cartas.':'Elige la IA.');
  return head+(me?'Elegí 1 de las 2 que quedan. La otra pasa a la ronda siguiente.':'Elige la IA entre las 2 que quedan.');
}
function vtRoster(t){
  const d=S.draft, paid={}; d.log.forEach(e=>{ if(e.type==='pick'&&e.team===t) paid[e.id]=e.cost; });
  const left=d.cap-d.spent[t];
  const rows=d.teams[t].map(id=>{const p=d.byId[id];return `<div class="it ${p.gk?'gk':''}"><span>${esc(p.ap)}</span><span class="muted">${p.gk?'ARQ':esc(POS[p.pos]||p.pos)} · ${paid[id]} fichas</span></div>`;});
  while(rows.length<6) rows.push('<div class="it empty">...</div>');
  return `<div><div class="bud"><div class="t"><b>${t===0?'Tu equipo':'IA'}</b><span>Te quedan <b style="font-size:18px;color:var(--gold)">${left}</b> de ${d.cap}</span></div><div class="timer"><i style="width:${left/d.cap*100}%"></i></div></div><div class="ros">${rows.join('')}</div></div>`;
}
function vetoScr(){
  const d=S.draft, t=E.vtTurn(d);
  if(!t) return `<h2>Equipos listos</h2><p class="muted">Pasamos al orden de pateadores.</p><div class="grid3"><div>${vtRoster(0)}</div><div>${vtRoster(1)}</div></div>`;
  const L=new Map(E.vtLegal(d).map(o=>[o.id,o.cost])), mine=t.team===0, veto=t.sub==='veto';
  const cards=t.options.map(id=>{
    const p=d.byId[id], ok=L.has(id), price=d.price[id], cost=L.get(id), canClick=mine&&ok;
    let note='';
    if (mine&&!ok) note = veto ? 'Inmune al veto' : (p.gk?'Ya tenés arquero':'No tenés cupo para este puesto');
    const pay = (!veto&&canClick&&cost<price) ? `<div class="small" style="color:var(--gold)">Pagás ${cost}: es lo que te queda.</div>` : '';
    return `<button class="pc ${p.gk?'gk':''} ${veto&&canClick?'veto':''}" data-id="${id}" ${canClick?'':'disabled'}>${cardInner(p,S.informed)}<div class="pr"><b>${price}</b><small>fichas</small></div>${veto&&canClick?'<div class="vetotag">Tocá para vetar</div>':''}${pay}${note?`<div class="small" style="color:var(--bad)">${note}</div>`:''}</button>`;
  }).join('');
  const feed=d.log.map(vtDText).filter(Boolean).slice(-8).reverse().map(x=>`<div>${x}</div>`).join('')||'<div>Todavía no pasó nada.</div>';
  return `<h2>Draft: veto y fichas</h2><div class="rolebox"><b>${mine?'Te toca':'Juega la IA'}.</b> ${vtRole(t)}</div>
  ${mine?timerRow():''}<div class="draft"><div><div class="grid2c" id="cards">${cards}</div><div class="card" style="margin-top:12px"><h3>Mesa</h3><div class="feed">${feed}</div></div></div>
  <div class="side">${vtRoster(0)}${vtRoster(1)}</div></div>`;
}
function bindVeto(){
  document.querySelectorAll('#cards .pc').forEach(b=>b.onclick=()=>{ if(b.disabled) return; S.draft=E.vtApply(S.draft,+b.dataset.id); render(); vetoTick(); });
}
function vetoTick(){
  if (S.screen!=='draft') return;
  const t=E.vtTurn(S.draft);
  if(!t){ setTimeout(()=>{ startOrder(); },900); render(); return; }
  if (t.team===0) startTimer(DRAFT_SEC,()=>{ const L=E.vtLegal(S.draft); S.draft=E.vtApply(S.draft,E.pick(S.rng,L).id); render(); vetoTick(); });
  else setTimeout(()=>{ if(S.screen!=='draft') return; S.draft=E.vtApply(S.draft,E.vtAI(S.draft,S.rng,S.diff)); render(); vetoTick(); },1200);
}

/* ---------- DRAFT: SUBASTA CIEGA ---------- */
const SOLD_MS = 6000;
function auBegin(kicker){
  const A=E.auNew(PLAYERS,S.rng,{lotSec:30});
  E.auStart(A,kicker); S.draft=A; S.F=A.F;
  S.au={A,phase:'lot',ai:null,sig:'',ext:0,guess:''};
  E.auNext(A,Date.now());
  if (A.over) S.au.phase='over'; else S.au.ai=E.auAIInit(A,S.rng,S.diff,1);
  S.screen='draft'; render();
}
const tnm = t => t===0?'Vos':RIV();
function auRoster(t){
  const A=S.au.A, paid={}; A.log.forEach(e=>{ if(e.team===t) paid[e.id]=e.price; });
  const rows=A.teams[t].map(id=>{const p=A.byId[id];return `<div class="it ${p.gk?'gk':''}"><span>${esc(p.ap)}</span><span class="muted">${p.gk?'ARQ':esc(POS[p.pos]||p.pos)} · ${paid[id]}</span></div>`;});
  while(rows.length<6) rows.push('<div class="it empty">...</div>');
  return `<div class="card"><h3>${t===0?'Tu equipo':RIV()}</h3><div class="bigfi">${A.budget[t]} <span class="small muted" style="font-family:var(--body);font-weight:600">fichas</span></div><div class="small muted" style="margin:4px 0 8px">Podés ofertar hasta ${Math.max(0,E.auMax(A,t))}.</div><div class="ros">${rows.join('')}</div></div>`;
}
function auTable(){
  const A=S.au.A, rows=A.log.map(e=>{const p=A.byId[e.id];
    return `<tr class="own${e.team}"><td><b>${esc(p.ap)}</b></td><td>${p.gk?'Arquero':esc(POS[p.pos]||p.pos)}</td><td>${p.dec}s</td><td>${p.org==='Inferiores'?'Inferiores':esc(p.org)}</td><td>${p.pierna==='I'?'Zurdo':p.pierna==='D'?'Derecho':'?'}</td><td>${esc(p.pais)}</td><td>${p.alt?p.alt.toFixed(2):'?'}</td><td>${p.sel?'Sí':'No'}</td><td>${e.price}${e.auto?' *':''}</td></tr>`;}).reverse().join('');
  if(!rows) return '<p class="small muted">Todavía no se vendió nadie. Acá vas a ver todos los datos de cada jugador vendido para detectar el patrón.</p>';
  return `<div class="scroll"><table class="sold"><thead><tr><th>Jugador</th><th>Puesto</th><th>Época</th><th>Cuna</th><th>Pierna</th><th>Nació en</th><th>Alt.</th><th>Selec.</th><th>Precio</th></tr></thead><tbody>${rows}</tbody></table></div><p class="small muted" style="margin-top:6px">Borde dorado: tuyo. Borde azul: de ${RIVl()}. * se lo llevó el único que tenía cupo, por 1 ficha.</p>`;
}
function cluesHtml(cl){
  return cl.map(c=>`<div class="clue k-${c.k} ${c.shown?'on':''}"><span class="cl">${c.label}</span><span class="cv">${c.shown?esc(c.text):'···'}</span></div>`).join('');
}
function bidHtml(){
  const a=S.au, A=a.A, c=A.cur, max=Math.max(0,E.auMax(A,0)), base=c.bid;
  const lead = c.leader===null ? 'Sorteo' : tnm(c.leader);
  let btns='';
  if (c.leader===0) btns=`<div class="small" style="color:var(--good)">Vas ganando con ${c.bid} fichas. Si ${RIVl()} no responde antes de que termine el reloj, es tuyo.</div>`;
  else {
    const set=[1,3,5,10].map(i=>base+i).filter(v=>v<=max);
    if (max>base && !set.includes(max)) set.push(max);
    btns=set.map(v=>`<button class="btn ${v===max&&set.length>1&&v!==base+1?'ghost':''}" data-bid="${v}">${v===max&&v>base+10?'Todo: ':'Ofertar '}${v}</button>`).join('')
      + (c.bid===0 ? `<button class="btn ghost" id="aDrop" title="El rival se lleva el lote por 1 ficha">Darme de baja</button>` : `<button class="btn ghost" id="aPass">Retirarme</button>`);
    if (!set.length) btns=`<div class="small muted">No te alcanzan las fichas para superar la oferta.</div><button class="btn ghost" id="aPass">Retirarme</button>`;
    if (c.bid===0) btns+=`<div class="small muted" style="flex-basis:100%">${c.pair?`Si te das de baja, elige primero ${RIVl()} por 1 ficha y vos te quedás con el otro arquero.`:`Si te das de baja, el lote se cierra ya y se lo lleva ${RIVl()} por 1 ficha.`}</div>`;
  }
  return `<div class="bidrow"><div><small>Oferta actual</small><b>${c.bid?c.bid:'—'}</b></div><div><small>Lidera</small><b class="${c.leader===0?'me':''}">${lead}</b></div><div><small>Tu tope</small><b>${max}</b></div></div><div class="row">${btns}</div>${c.bid===0?`<div class="small muted" style="margin-top:6px">Si nadie ofrece, se sortea y se lo lleva uno por 1 ficha. Quien lidera hoy es "Sorteo".</div>`:''}`;
}
function gkCards(sel){
  const A=S.au.A, ids=A.cur&&A.cur.pair?A.cur.pair:A.pair||[];
  return `<div class="grid2c" style="margin:10px 0">${ids.map(id=>{const p=A.byId[id];return `<div class="pc gk">${cardInner(p,true)}${sel?`<button class="btn" style="margin-top:8px;width:100%" data-gk="${id}">Elegir a ${esc(p.ap)}</button>`:''}</div>`;}).join('')}</div>`;
}
function lotInner(){
  const a=S.au, A=a.A;
  if (a.phase==='pick'){
    const pk=A.cur.pick, mine=pk.team===0;
    const how = pk.nobids ? `Nadie ofreció: el sorteo lo ganó ${tnm(pk.team).toLowerCase()}, que elige por 1 ficha.` : `${mine?'Ganaste':tnm(pk.team)+' ganó'} el derecho a elegir por <b>${pk.price}</b> ${pk.price===1?'ficha':'fichas'}.`;
    return `<h3>Elección de arquero</h3><p>${how}</p><p class="small muted">${mine?'Elegí uno: el otro se lo queda '+RIVl()+' por 1 ficha.':'Está eligiendo '+RIVl()+'. Te quedás con el otro arquero por 1 ficha.'} Tiempo: <b id="aPickT"></b></p>${gkCards(mine)}`;
  }
  if (a.phase==='sold'){
    const last=A.log[A.log.length-1], two=!!last.left, e=two?A.log[A.log.length-2]:last, p=A.byId[e.id];
    let how, extra='', cards;
    if (two){
      const q=A.byId[last.id], d=E.ovr(p)-E.ovr(q);
      how = e.nobids ? `Nadie ofreció: el sorteo lo ganó ${tnm(e.team).toLowerCase()}, que eligió a <b>${esc(p.nombre)}</b> por 1 ficha.` : `${e.team===0?'Vos elegiste':esc(tnm(e.team))+' eligió'} a <b>${esc(p.nombre)}</b> por <b>${e.price}</b> ${e.price===1?'ficha':'fichas'}.`;
      extra = `<p class="small muted">${last.team===0?'Vos te quedás':esc(tnm(last.team))+' se queda'} con <b>${esc(q.nombre)}</b> por 1 ficha. Diferencia de nivel entre los dos: ${Math.abs(d)}.</p>`;
      cards = `<div class="grid2c" style="margin:10px 0"><div class="pc gk">${cardInner(p,true)}</div><div class="pc gk">${cardInner(q,true)}</div></div>`;
    } else {
      how = e.nobids ? `Nadie ofreció: el sorteo lo ganó ${tnm(e.team).toLowerCase()} y lo paga 1 ficha.` : `${tnm(e.team)} se lleva a <b>${esc(p.nombre)}</b> por <b>${e.price}</b> ${e.price===1?'ficha':'fichas'}.`;
      const verdict = e.nobids ? '' : (e.price<=e.fair*0.9?'Buen negocio.':e.price>=e.fair*1.15?'Se pagó de más.':'Precio de mercado.');
      extra = `<p class="small muted">Valor de mercado: unas ${Math.round(e.fair)} fichas. ${verdict}</p>`;
      cards = `<div class="grid2c" style="margin:10px 0"><div class="pc ${p.gk?'gk':''}">${cardInner(p,true)}</div></div>`;
    }
    return `<h3>Vendido</h3><p>${how}</p>${extra}${cards}<div class="row">${S.online?'':'<button class="btn" id="aSkip">Siguiente lote</button>'}<span class="muted">Sigue solo en <b id="aSoldT"></b></span></div>`;
  }
  const c=A.cur;
  if (c.pair) return `<div class="row" style="justify-content:space-between"><h3>Lote 1: los dos arqueros</h3><div><span class="bigt" id="aTtxt"></span><span class="ext" id="aExt"></span></div></div>

  <p class="small muted" style="margin:0 0 4px">Se subasta el derecho a <b>elegir</b>. Quien gana paga su oferta y elige uno; el otro arquero es del rival por 1 ficha. Si los dos son parecidos, no vale la pena pagar mucho.</p>
  ${gkCards(false)}<div id="aClues"></div><div class="small muted" id="aNext" style="margin:4px 0 8px"></div><div id="aBid"></div>`;
  return `<div class="row" style="justify-content:space-between"><h3>Lote ${A.lot+1}: jugador a subasta</h3><div><span class="bigt" id="aTtxt"></span><span class="ext" id="aExt"></span></div></div>
  <div class="timer" style="margin:8px 0 12px"><i id="aBar" style="width:100%;transition:none"></i></div>
  <div id="aClues"></div><div class="small muted" id="aNext" style="margin:4px 0 8px"></div><div id="aBid"></div>`;
}
function descarteHtml(){

function auOver(){

function auScr(){

  return `<h2>Subasta ciega</h2><div class="rolebox"><b>Lote ${A.lot+1} de ${A.lots.length}.</b> Primero se subasta el derecho a elegir arquero (los dos se ven completos). Después van los 10 jugadores de campo, que tienen algo en común. Puesto, época y partidos en Boca se ven al instante; el nombre aparece cuando faltan 20 segundos y perks y nivel cuando faltan 10. Cada jugador vendido queda en la tabla con todos sus datos para que descubras el patrón. Una oferta en los últimos 3 segundos suma 5 segundos.</div>
  <div class="draft"><div><div class="card" id="lotCard">${lotInner()}</div><div class="card" style="margin-top:12px"><h3>Vendidos</h3>${auTable()}</div></div>
  <div class="side">${auRoster(0)}${auRoster(1)}<div class="card"><h3>Tu sospecha</h3><p class="small muted">No cambia el juego. Al final te decimos si acertaste.</p><select id="guess" aria-label="Tu sospecha del patrón"><option value="">Todavía no sé</option>${opts}</select></div></div></div>`;
}
function auLive(now){
  const a=S.au, A=a.A, c=A.cur; if(!c||a.phase!=='lot') return;
  const rem=Math.max(0,c.end-now), tot=A.lotSec*1000, bar=$('#aBar'), tx=$('#aTtxt');
  if(bar){ bar.style.width=Math.min(100,rem/tot*100)+'%'; bar.style.background=rem<=3000?'var(--bad)':'var(--gold)'; }
  if(tx){ tx.textContent=Math.ceil(rem/1000)+' s'; tx.style.color=rem<=3000?'var(--bad)':''; }
  const tSec=(now-c.start)/1000, cl=c.pair?[]:(S.online?c.clues:E.auClues(A,c.id,tSec)), shown=cl.filter(x=>x.shown).length;
  const sig=[shown,c.bid,c.leader,c.done[0],E.auMax(A,0)].join('|');
  if (sig!==a.sig){
    a.sig=sig; if(!c.pair) $('#aClues').innerHTML=cluesHtml(cl); $('#aBid').innerHTML=bidHtml(); bindBid();
  }
  if (c.ext!==a.ext){ a.ext=c.ext; const x=$('#aExt'); if(x){ x.textContent='+5 s'; setTimeout(()=>{ const y=$('#aExt'); if(y) y.textContent=''; },1500); } }
  const nx=cl.find(x=>!x.shown), nn=$('#aNext'); if(nn&&!c.pair) nn.textContent = nx ? `Próxima pista (${nx.label.toLowerCase()}) en ${Math.ceil(nx.at-tSec)} s.` : 'Ya se revelaron todas las pistas.';
}
function bindBid(){
  document.querySelectorAll('[data-bid]').forEach(b=>b.onclick=()=>{ if(S.online){ olSend({t:'bid',amount:+b.dataset.bid}); return; } E.auBid(S.au.A,0,+b.dataset.bid,Date.now()); S.au.sig=''; auLive(Date.now()); });
  const dr=$('#aDrop'); if(dr) dr.onclick=()=>{ if(S.online){ olSend({t:'drop'}); return; } E.auDrop(S.au.A,0); S.au.sig=''; auLive(Date.now()); };
  const p=$('#aPass'); if(p) p.onclick=()=>{ if(S.online){ olSend({t:'pass'}); return; } E.auPass(S.au.A,0); S.au.sig=''; auLive(Date.now()); };
}
function auAdvance(){
  const a=S.au, A=a.A, now=Date.now();
  E.auNext(A,now);
  if (A.over){ a.phase='over'; S.draft=A; } else { a.phase='lot'; a.ai=E.auAIInit(A,S.rng,S.diff,1); a.sig=''; a.ext=0; }
  render();
}
function auLoop(){
  const a=S.au; if(!a||S.screen!=='draft'||S.dmode!=='subasta'){ clearInterval(S&&S.atick); return; }
  if (S.online){ if(a.phase==='lot') auLive(sNow()); else if(a.phase==='pick'){ const x=$('#aPickT'); if(x) x.textContent=Math.max(0,Math.ceil((a.A.cur.pick.until-sNow())/1000))+' s'; } else if(a.phase==='sold'){ const x=$('#aSoldT'); if(x) x.textContent=Math.max(0,Math.ceil((a.until-sNow())/1000))+' s'; } return; }
  const A=a.A, now=Date.now();
  if (a.phase==='lot'){
    const act=E.auAIStep(A,a.ai,now);
    if (act){ if(act.type==='bid') E.auBid(A,1,act.amount,now); else E.auPass(A,1); }
    const ev=E.auTick(A,now);
    if (ev.length){
      if (ev[0].type==='gkwin'){ a.phase='pick'; a.aiPickAt=now+1800+Math.random()*1200; render(); return; }
      a.phase='sold'; a.soldUntil=now+SOLD_MS; render(); return;
    }
    auLive(now);
  } else if (a.phase==='pick'){
    const pk=A.cur.pick, x=$('#aPickT'); if(x) x.textContent=Math.max(0,Math.ceil((pk.until-now)/1000))+' s';
    let ev=[];
    if (pk.team===1 && now>=a.aiPickAt) ev=E.auPickGK(A,1,E.auBestGK(A)); else ev=E.auTick(A,now);
    if (ev.length){ a.phase='sold'; a.soldUntil=now+SOLD_MS; render(); }
  } else if (a.phase==='sold'){
    const left=Math.max(0,a.soldUntil-now), x=$('#aSoldT'); if(x) x.textContent=Math.ceil(left/1000)+' s';
    if (left<=0) auAdvance();
  }
}
function bindAu(){
  const a=S.au; if(!a) return;
  const g=$('#guess'); if(g) g.onchange=e=>{ a.guess=e.target.value; };
  if (a.phase==='over'){ $('#aGo').onclick=()=>{ if(S.online){ olSend({t:'ready'}); a.ready[0]=true; const g=$('#aGo'); g.disabled=true; g.textContent='Esperando a tu rival...'; } else startOrder(); }; return; }

  a.sig=''; auLoop(); S.atick=setInterval(auLoop,200);
}

/* ORDEN */
function startOrder(){

  S.gkMe = S.myTeam.find(p=>p.gk);
  S.order = E.aiOrder(S.myTeam.filter(p=>!p.gk)).map(p=>p.id);
  S.timeLeft = S.online ? Math.max(5,Math.min(ORDER_SEC,Math.round((S.ol.orderDeadline-sNow()-2500)/1000))) : ORDER_SEC; S.orderSent=false; S.screen='order'; render();
  S.tick = setInterval(()=>{ S.timeLeft--; const bar=$('#tbar'), tx=$('#ttxt'); if(bar){bar.style.width=(S.timeLeft/ORDER_SEC*100)+'%'; tx.textContent=S.timeLeft+' s';} if(S.timeLeft<=0){ clearInterval(S.tick); if(S.online) olSendOrder(); else beginMatch(); } },1000);
}
function orderScr(){
  const by = S.draft.byId;
  const first = S.draft.S===0 ? 'Vos' : RIV();
  if (S.orderSent) return `<h2>Orden de pateadores</h2><p class="muted">Tu orden está confirmado. Esperando a ${RIVl()}...</p>`;
  const items = S.order.map((id,i)=>{const p=by[id];return `<div class="it"><div class="n">${i+1}</div><div><b>${esc(p.nombre)}</b> <span class="muted small">· ${esc(POS[p.pos]||p.pos)}</span><div class="chips" style="margin-top:4px">${E.perksOf(p).map(k=>`<span class="chip ${k.tone}" title="${esc(k.desc)}">${esc(k.label)}</span>`).join('')}${S.informed&&p.k?`<span class="stat">Pateó ${p.k.n}, ${p.k.g} goles</span>`:''}</div></div><div class="mv"><button data-up="${i}" ${i===0?'disabled':''} aria-label="Subir">▲</button><button data-dn="${i}" ${i===4?'disabled':''} aria-label="Bajar">▼</button></div></div>`;}).join('');
  return `<h2>Orden de pateadores</h2><p class="muted">Arquero de tu equipo: <b>${esc(S.gkMe.nombre)}</b>. Solo patea si hay empate tras los cinco. En la tanda patea primero: <b>${first}</b>.</p>
  <div class="row" style="margin:10px 0"><div class="timer" style="flex:1"><i id="tbar" style="width:${S.timeLeft/ORDER_SEC*100}%"></i></div><b id="ttxt">${S.timeLeft} s</b></div>
  <div class="ord">${items}</div><div class="row" style="margin-top:14px"><button class="btn" id="ok">Confirmar orden</button><button class="btn ghost" id="sug">Orden sugerido</button></div>`;
}
function bindOrder(){
  if (S.orderSent) return;
  document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{const i=+b.dataset.up;[S.order[i-1],S.order[i]]=[S.order[i],S.order[i-1]];keepTimer();});
  document.querySelectorAll('[data-dn]').forEach(b=>b.onclick=()=>{const i=+b.dataset.dn;[S.order[i+1],S.order[i]]=[S.order[i],S.order[i+1]];keepTimer();});
  $('#sug').onclick=()=>{S.order=E.aiOrder(S.myTeam.filter(p=>!p.gk)).map(p=>p.id);keepTimer();};
  $('#ok').onclick=()=>{ if(S.online) olSendOrder(); else {clearInterval(S.tick);beginMatch();} };
}
function keepTimer(){ const t=S.tick; app.innerHTML=`<div class="topbar"><div class="brand">Tanda de <b>Penales</b></div><span><span class="tag">${S.online?'Online':'Prototipo'}</span><button class="leave" id="leave">Salir de la partida</button></span></div>`+orderScr(); S.tick=t; bindOrder(); bindLeave(); }

/* PARTIDO */
function beginMatch(){
  const d=S.draft, by=d.byId;
  const mk = (t,ord)=>{const ps=d.teams[t].map(id=>by[id]);return {name:NAMES[t],gk:ps.find(p=>p.gk),order:ord||E.aiOrder(ps.filter(p=>!p.gk))};};
  const teams=[mk(0,S.order.map(id=>by[id])), mk(1)];
  S.teams=teams;
  S.sh = new E.Shootout(teams, d.S, S.rng, {mode:S.mode});
  S.feed=[{c:'sys',t:`Empieza la tanda. Patea primero ${d.S===0?'Azul (vos)':'Oro (la IA)'}.`}];
  S.screen='match'; S.rec=null; S.pk=S.sh.peek(); resetSel(); pushPre(); render();
}
function autoShot(){
  const pk=S.pk, r=S.rng;
  if (pk.team===0){
    if(!S.sel.aim){ if(S.mode==='zonas'){ const i=Math.floor(r()*9), z=E.ZONES[i]; S.sel.aim={x:z.x,y:z.y,zone:i}; } else S.sel.aim={x:(r()<.5?-1:1)*(.8+r()*1.8), y:.5+r()*1.3}; }
  } else if (S.sel.dive==null) S.sel.dive=Math.floor(r()*9);

}
function resetSel(){ S.sel={type:'normal',aim:null,dive:null}; S.px=null; chatReset(); }
function pushPre(){ S.feed.push({c:'pre',t:E.narratePre(S.rng,S.pk)}); }
function board(){
  const sh=S.sh;
  const dots = t=>{
    const res=sh.log.filter(r=>r.pk.team===t&&r.pk.phase==='reg').map(r=>r.result==='goal'?'g':'m');
    const cur = S.pk && S.pk.team===t && S.pk.phase==='reg' && !S.rec ? res.length : -1;
    let h=''; for(let i=0;i<5;i++){ const k=res[i]; h+=`<div class="dot ${k||''} ${i===cur?'cur':''}">${k==='g'?'✓':k==='m'?'✕':''}</div>`; }
    const extra=sh.log.filter(r=>r.pk.team===t&&r.pk.phase!=='reg').map(r=>r.result==='goal'?'g':'m');
    extra.forEach(k=>h+=`<div class="dot ${k}">${k==='g'?'✓':'✕'}</div>`);
    return `<div class="dots">${h}</div>`;
  };
  const ph = sh.phase==='reg'?'Mejor de 5':sh.phase==='gk'?'Patean los arqueros':'Muerte súbita';
  return `<div class="board"><div class="tm"><div class="tn me">${S.online?esc(S.myName)+' · vos':'Azul · vos'}</div>${dots(0)}</div><div class="score">${sh.sc[0]} - ${sh.sc[1]}<small>${ph.toUpperCase()}</small></div><div class="tm r"><div class="tn">${S.online?esc(S.rivalName):'Oro · IA'}</div>${dots(1)}</div></div>`;
}
const PX=E.PX, SX=x=>300+x*PX, SY=y=>260-y*PX;
function targets(rec){
  const dv=E.DIVES[rec.dive];
  const keeper=`transform:translate(${dv.x*PX*0.9}px,${-(dv.y-1.0)*PX*0.8}px) rotate(${Math.max(-1,Math.min(1,dv.x/2.3))*50}deg);transform-origin:300px 200px`;
  const bx=SX(rec.land.x)-300, by=SY(rec.land.y)-288;
  const out=rec.result==='wide'; 
  return {keeper, ball:`transform:translate(${bx}px,${by}px) scale(.62);transform-origin:300px 288px`};
}
function reticleSigma(){
  // círculo de error del pateador (1,5 sigma) según tipo, jugador y lado elegido
  const pk=S.pk, a=S.sel.aim||{x:0,y:1.2};
  const m=E.modifiers(pk.kicker,pk.keeper,E.physOf(a.x),S.sh.ctxOf(pk));
  const g=E.kickParams(S.sel.type,m); return {rx:1.5*g.sx*PX, ry:1.5*g.sy*PX, sx:g.sx};
}
function goalSvg(pk, rec){
  const mineKicks = pk.team===0, free = S.mode==='libre';
  const canPick = !rec && !S.busy;
  const showZones = !rec && (!mineKicks || !free);
  let zones='';
  if (showZones) for(let r=0;r<3;r++)for(let c=0;c<3;c++){ const i=r*3+c; const sel = mineKicks ? (S.sel.aim&&S.sel.aim.zone===i) : (S.sel.dive===i);
    zones+=`<rect class="zone ${sel?'sel':''}" data-zone="${i}" x="${60+c*160}" y="${100+(2-r)*160/3}" width="160" height="${160/3}"/>`; }
  const T = rec ? targets(rec) : {ball:'transform:translate(0,0);transform-origin:300px 288px',keeper:'transform:none;transform-origin:300px 200px'};
  let marks='';
  if (rec){
    marks+=`<circle cx="${SX(rec.kick.x)}" cy="${SY(rec.kick.y)}" r="7" fill="none" stroke="#f4c20d" stroke-width="2.5" stroke-dasharray="3 3"/>`;
    marks+=`<ellipse cx="${SX(rec.kick.x)}" cy="${SY(rec.kick.y)}" rx="${1.5*rec.sigma.x*PX}" ry="${1.5*rec.sigma.y*PX}" fill="#f4c20d12" stroke="#f4c20d55"/>`;
    marks+=`<circle cx="${SX(rec.land.x)}" cy="${SY(rec.land.y)}" r="5" fill="${rec.result==='goal'?'#3ddc97':'#ff6b6b'}" stroke="#fff" stroke-width="1.5"/>`;
  } else if (mineKicks && S.sel.aim){
    const rt=reticleSigma(), a=S.sel.aim;
    marks+=`<ellipse id="ret" cx="${SX(a.x)}" cy="${SY(a.y)}" rx="${rt.rx}" ry="${rt.ry}" fill="#f4c20d22" stroke="#f4c20d" stroke-width="2"/><path id="cross" d="M${SX(a.x)-8} ${SY(a.y)}H${SX(a.x)+8}M${SX(a.x)} ${SY(a.y)-8}V${SY(a.y)+8}" stroke="#f4c20d" stroke-width="2.5"/>`;
  }
  return `<canvas id="gcv" class="pxc" width="150" height="80" aria-hidden="true"></canvas><svg id="gsvg" viewBox="0 0 600 320" role="img" aria-label="Arco">
   ${(!rec && !mineKicks && S.sel.dive!=null)?`<circle cx="${SX(E.DIVES[S.sel.dive].x)}" cy="${SY(E.DIVES[S.sel.dive].y)}" r="8" fill="#6f93ff" stroke="#fff" stroke-width="2"/>`:''}
   ${zones}
   ${(!rec && mineKicks && free)?`<rect id="cap" x="40" y="80" width="520" height="190" fill="transparent" style="cursor:crosshair"/>`:''}
   ${marks}
  </svg>${!rec?`<div class="prompt"><span id="ptxt">${promptText(mineKicks,free)}</span></div>`:''}`;
}
function promptText(mine,free){ if(!mine) return S.sel.dive==null?'Elegí hacia dónde tirarte':'Confirmá tu tiro'; if(!free) return S.sel.aim?'Confirmá el remate':'Elegí la zona del remate'; return S.sel.aim?'Mové el punto o confirmá el remate':'Tocá el arco para apuntar'; }

    const s = c.createBufferSource(), bp = c.createBiquadFilter(), g = c.createGain(); s.buffer = AUD.noise; s.loop = true; bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = .7;
    g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(vol / (i + 1), t + .35); g.gain.setValueAtTime(vol / (i + 1), t + d * .6); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    s.connect(bp); bp.connect(g); g.connect(AUD.master); s.start(t); s.stop(t + d + .05);
  });
}
function uhh(t, d, vol) {
  const c = AUD.ctx;[0, 3, 7, 12].forEach(dt => {
    const o = c.createOscillator(), f1 = c.createBiquadFilter(), f2 = c.createBiquadFilter(), g = c.createGain(), v = c.createOscillator(), vg = c.createGain();
    o.type = 'sawtooth'; o.frequency.setValueAtTime(230 * Math.pow(2, dt / 12 / 3), t); o.frequency.exponentialRampToValueAtTime(130 * Math.pow(2, dt / 12 / 3), t + d);
    v.frequency.value = 5; vg.gain.value = 4; v.connect(vg); vg.connect(o.frequency);
    f1.type = 'bandpass'; f1.frequency.value = 650; f1.Q.value = 3; f2.type = 'bandpass'; f2.frequency.value = 1100; f2.Q.value = 3;
    g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(vol, t + .25); g.gain.setValueAtTime(vol, t + d * .55); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(f1); o.connect(f2); f1.connect(g); f2.connect(g); g.connect(AUD.master); o.start(t); v.start(t); o.stop(t + d + .05); v.stop(t + d + .05);
  });
  roar(t, d, .05);
}
function sfx(n) {
  if (prefs.music === false || !AUD.ctx || AUD.ctx.state !== 'running') return; const t = AUD.ctx.currentTime + .01;
  if (n === 'kick') { hit(t, .12, .25, 400); tone(160, t, .14, 'sine', .3, 50); }

  else if (n === 'ping') { tone(mtof(88), t, .06, 'square', .04); tone(mtof(93), t + .06, .08, 'square', .04); }
}

function tandaAwards(sh){
  const L=sh.log, W=sh.winner, GW=E.GW, GH=E.GH;
  const wt=pk=>1+(pk.first?1:0)+((pk.winOnGoal||pk.loseOnMiss)?2:(pk.decisive?1:0));
  const dist=r=>{ const x=Math.abs(r.land.x), y=Math.abs(r.land.y); return Math.hypot(Math.max(0,x-GW),Math.max(0,y-GH)); };
  const out={figura:null,mejor:null,burro:null};
  // Figura: del equipo ganador. El arquero pesa si atajó más que el otro; si no, el que definió.
  const sv=t=>L.filter(r=>r.pk.team!==t&&r.result==='save'); // atajadas del arquero del equipo t
  const svW=sv(W), svL=sv(1-W), cand=[];
  if (svW.length){ const gk=svW[0].pk.keeper, diff=svW.length-svL.length, key=svW.reduce((a,r)=>a+wt(r.pk),0);
    cand.push({sc:key*2+(diff>=1?4*diff:0),p:gk,why:`Atajó ${svW.length===1?'un penal':svW.length+' penales'}${svW.some(r=>wt(r.pk)>=3)?' y uno fue clave':''}`}); }
  const last=L[L.length-1];
  const km={}; L.filter(r=>r.pk.team===W&&r.result==='goal').forEach(r=>{ const k=r.pk.kicker.id; km[k]=km[k]||{p:r.pk.kicker,sc:0,n:0}; km[k].sc+=.6*wt(r.pk); km[k].n++; if(r===last) km[k].def=true; });
  Object.values(km).forEach(o=>{ if(o.def) o.sc+=2.5; cand.push({sc:o.sc,p:o.p,why:o.def?'Convirtió el penal que definió la tanda':'Convirtió '+(o.n===1?'su penal':o.n+' penales')}); });
  cand.sort((a,b)=>b.sc-a.sc); if(cand[0]) out.figura={p:cand[0].p,team:W,why:cand[0].why};
  // Mejor pateador: el penal convertido más al ángulo y más fuerte
  let best=null; L.filter(r=>r.result==='goal').forEach(r=>{
    const x=Math.abs(r.land.x), y=Math.abs(r.land.y), d=Math.hypot(GW-x,GH-y), ang=Math.max(0,1-d/1.6), pw=r.kick.type==='fuerte'?1:r.kick.type==='picada'?.25:.4;
    const sc=ang*.7+pw*.3+.01*wt(r.pk); if(!best||sc>best.sc) best={sc,r,d}; });
  if (best) out.mejor={p:best.r.pk.kicker,team:best.r.pk.team,why:`Penal ${best.r.kick.type==='fuerte'?'fuerte':best.r.kick.type==='picada'?'de picada':'colocado'}${best.d<1.2?' a '+Math.round(best.d*100)+' cm del ángulo':', el mejor ejecutado de la tanda'}`,n:L.indexOf(best.r)};
  // Burro: el que erró; si hay varios, el que la tiró más lejos o erró el más clave
  const miss=L.filter(r=>r.result!=='goal'); let worst=null;
  miss.forEach(r=>{ const d=dist(r), sc=wt(r.pk)*1.2+d+(r.result==='save'?-.4:r.result==='wide'?.8:0); if(!worst||sc>worst.sc) worst={sc,r,d}; });
  if (worst){ const r=worst.r, how=r.result==='save'?'Se lo atajaron':r.result==='post'?'La mandó al palo':r.result==='bar'?'La mandó al travesaño':`La tiró afuera, a ${worst.d.toFixed(1).replace('.',',')} m del arco`;
    out.burro={p:r.pk.kicker,team:r.pk.team,why:how+(wt(r.pk)>=3?' en un penal clave':''),n:L.indexOf(r),only:miss.length===1}; }
  return out;
}

  <div class="card" style="margin:12px 0"><h3>La tanda completa</h3>
    <div class="tdots"><b class="tb">${nm(0)}</b>${dots(0)}</div><div class="tdots r"><b class="to">${nm(1)}</b>${dots(1)}</div>

  const rules = host ? `<p class="small muted" style="margin:0 0 8px">Cada lote dura 30 segundos.</p><div class="small muted">Puntería</div><div class="seg">${[['libre','Punto libre'],['zonas','9 zonas']].map(([v,l])=>`<button data-omode="${v}" aria-pressed="${o.mode===v}">${l}</button>`).join('')}</div>` : `<p>Lote de <b>${o.lotSec} segundos</b>. Puntería: <b>${o.mode==='libre'?'punto libre':'9 zonas'}</b>.</p><p class="small muted">Las reglas las elige quien creó la sala.</p>`;
  return `<h2>Sala ${OL.code}</h2>
  <div class="card" style="margin:12px 0"><h3>${host?'Pasale este link a tu rival':'Link de la sala'}</h3><div class="row"><input class="txt" id="olLink" readonly value="${esc(link)}" style="flex:1;min-width:200px"><button class="btn" id="olCopy">Copiar link</button></div><p class="small muted" style="margin:8px 0 0">Código: <b>${OL.code}</b>. Formato: subasta ciega.</p></div>
  <div class="grid2c"><div class="card"><h3>Jugadores</h3><div class="ros">${me}${riv}</div></div><div class="card"><h3>Reglas</h3>${rules}</div></div>
  <div class="row" style="margin-top:14px">${host?`<button class="btn" id="olStart" ${rivalIn&&OL.online[1]?'':'disabled'}>Empezar</button>`:'<span class="muted">Esperando a que empiece quien creó la sala...</span>'}<button class="btn ghost" id="olLeave">Salir</button></div>`;
}
function bindOlLobby(){
  $('#olCopy').onclick=()=>{ const i=$('#olLink'); try{ navigator.clipboard.writeText(i.value).then(()=>notice('Link copiado.',2000),()=>{i.select();}); }catch(e){ i.select(); } };
  document.querySelectorAll('[data-olot]').forEach(b=>b.onclick=()=>olSend({t:'opts',lotSec:+b.dataset.olot}));
  document.querySelectorAll('[data-omode]').forEach(b=>b.onclick=()=>olSend({t:'opts',mode:b.dataset.omode}));
  const st=$('#olStart'); if(st) st.onclick=()=>olSend({t:'start'});
  $('#olLeave').onclick=()=>olLeave();
}
function olToss(){
  const t=S.toss, mine=t.winner===OL.seat, coin=`<div class="coin">${t.face==='CARA'?'C':'X'}</div>`;
  if (mine) return `<div class="final">${coin}<h2>Ganaste el sorteo</h2><p class="muted">Salió ${t.face.toLowerCase()}. Elegí si querés patear primero o segundo en la tanda. Patear primero es una ventaja, pero arrancás la subasta con 5 fichas menos: 95 contra 100.</p><div class="row" style="justify-content:center"><button class="btn" data-k="1">Patear primero (95 fichas)</button><button class="btn ghost" data-k="0">Patear segundo (100 fichas)</button></div></div>`;
  return `<div class="final">${coin}<h2>Ganó el sorteo ${esc(S.rivalName)}</h2><p class="muted">Está decidiendo si patea primero o segundo...</p></div>`;
}
function bindOlToss(){ document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>olSend({t:'toss',kickFirst:b.dataset.k==='1'})); }

render();
})();
</script>
</body>
</html>
